# Custom vhost on the existing Mailcow edge. Do not modify its core vhost.
server {
    include /etc/nginx/conf.d/listen_plain.active;
    server_name api.crm.o7digitalgroup.com;
    root /web;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /etc/nginx/conf.d/listen_ssl.active;
    server_name api.crm.o7digitalgroup.com;
    ssl_certificate /etc/ssl/mail/o7-crm/letsencrypt/live/api.crm.o7digitalgroup.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/mail/o7-crm/letsencrypt/live/api.crm.o7digitalgroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $crm_proxy http://o7-proxy:8080;
        proxy_pass $crm_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 70s;
    }
    add_header X-Content-Type-Options nosniff always;
}
